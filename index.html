<title>Upravnik — Odgovori stanarima</title>
<meta name="theme-color" content="#12337a">
<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#162033;--mu:#5a6678;--pr:#12337a;--or:#e8730c;--ok:#17703f;--bad:#b3261e;--bd:#d3d9e3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:20px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{background:var(--pr);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header h1{font-size:23px;margin:0}
.mini{background:#ffffff26;color:#fff;border:0;border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;font-weight:700}
.tabs{display:flex;gap:8px;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:1;min-height:58px;border:2px solid var(--pr);background:#fff;color:var(--pr);border-radius:14px;font:inherit;font-size:17px;font-weight:700;padding:6px}
.tab.on{background:var(--pr);color:#fff}
main{max-width:660px;margin:0 auto;padding:0 14px}
.step{font-size:22px;font-weight:800;margin:26px 0 8px;color:var(--pr)}
label{display:block;font-weight:700;margin:14px 0 6px}
select,input,textarea{width:100%;font:inherit;font-size:19px;color:var(--tx);background:#fff;border:2px solid var(--bd);border-radius:14px;padding:12px}
select{min-height:60px}textarea{min-height:130px;resize:vertical}
.outbox{min-height:210px;border-color:var(--pr);background:#fbfcff}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:68px;margin:10px 0;border:0;border-radius:16px;background:var(--pr);color:#fff;font:inherit;font-size:21px;font-weight:800;padding:10px}
.big.orange{background:var(--or)}.big.green{background:var(--ok)}
.big.ghost{background:#fff;color:var(--pr);border:2px solid var(--pr)}
.big.sm{min-height:52px;font-size:17px}
.chip{background:#e6edfb;color:var(--pr);border-radius:14px;padding:12px 14px;font-weight:800;margin:10px 0}
.hint{color:var(--mu);font-size:16px;min-height:1.3em}
.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin:12px 0}
.badge{display:inline-block;background:#e6edfb;color:var(--pr);border-radius:8px;padding:2px 8px;font-size:15px;font-weight:700}
.ok{background:#dff3e6;color:var(--ok)}.warn{background:#fdebd5;color:#9a4b00}
.q{color:var(--mu);font-size:17px;margin:6px 0;white-space:pre-wrap}.a{white-space:pre-wrap;font-size:18px;margin:6px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
details{margin:10px 0}summary{font-weight:700;padding:10px 0;color:var(--pr)}
details input{margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#162033;color:#fff;border-radius:14px;padding:14px 20px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
img.p{max-width:100%;border-radius:10px;margin:6px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.th{position:relative;width:98px;height:98px;border-radius:12px;overflow:hidden;border:2px solid var(--bd);background:#000}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:3px;right:3px;width:34px;height:34px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:17px;font-weight:800}
.th .pl{position:absolute;left:7px;bottom:4px;color:#fff;font-size:20px;text-shadow:0 0 4px #000}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}

<header><h1 data-t="Odgovori stanarima">Odgovori stanarima</h1><button class="mini" onclick="toggleScript()">ABC / АБВ</button></header>

 <div class="row"><button id="m_t" class="tab on" onclick="mode('tenant')" data-t="Za stanara">Za stanara</button><button id="m_m" class="tab" onclick="mode('master')" data-t="Za majstora">Za majstora</button></div>
 <textarea id="out" class="outbox" aria-label="Odgovor"></textarea>
 <button class="big ghost" onclick="pick('r')" data-t="📎 Dodaj sliku / video uz odgovor">📎 Dodaj sliku / video uz odgovor</button>
 <div id="mr" class="thumbs" data-slot="r"></div>
 <button class="big green" onclick="copyT('out')" data-t="📋 Kopiraj odgovor">📋 Kopiraj odgovor</button>

</section>

  function toCyr(text) {
    if (!text) return "";
    const digraphs = [
      ["DŽ", "Џ"], ["Dž", "Џ"], ["dž", "џ"],
      ["LJ", "Љ"], ["Lj", "Љ"], ["lj", "љ"],
      ["NJ", "Њ"], ["Nj", "Њ"], ["nj", "њ"]
    ];
    let out = text;
    for (const [lat, cyr] of digraphs) {
      out = out.split(lat).join(cyr);
    }
    const map = {
      A:"А", B:"Б", V:"В", G:"Г", D:"Д", Đ:"Ђ", E:"Е", Ž:"Ж", Z:"З", I:"И",
      J:"Ј", K:"К", L:"Л", M:"М", N:"Н", O:"О", P:"П", R:"Р", S:"С", T:"Т",
      Ć:"Ћ", U:"У", F:"Ф", H:"Х", C:"Ц", Č:"Ч", Š:"Ш",
      a:"а", b:"б", v:"в", g:"г", d:"д", đ:"ђ", e:"е", ž:"ж", z:"з", i:"и",
      j:"ј", k:"к", l:"л", m:"м", n:"н", o:"о", p:"п", r:"р", s:"с", t:"т",
      ć:"ћ", u:"у", f:"ф", h:"х", c:"ц", č:"ч", š:"ш"
    };
    return out.split("").map(ch => map[ch] ?? ch).join("");
  }

  function fmtScript(text) {
    return state.script === "cyr" ? toCyr(text) : text;
  }

  function normTxt(t) {
    return (t || "").toLowerCase().replace(/[čć]/g, "c").replace(/š/g, "s").replace(/ž/g, "z").replace(/đ/g, "dj").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  }

  function scoreTemplate(tpl, txt, words) {
    let n = 0;
    for (const k of tpl.keywords) {
      const exact = k.endsWith("$");
      const kw = normTxt(k.replace("$", ""));
      const hit = kw.includes(" ") ? (" " + txt).includes(" " + kw) : words.some(w => exact ? w === kw : w.startsWith(kw));
      if (hit) n++;
    }
    return n;
  }

  const NOTICES = {
    info:   { label: "Opšte obaveštenje za stanare", f: (b, w, r) => `Poštovani stanari zgrade ${b}${w}, ${r || "molimo da obratite pažnju na obaveštenje upravnika."}. Upravnik.`.replace("..", ".") },
    start:  { label: "Početak radova (sa BZR napomenom)", f: (b, w, r) => `Poštovani stanari zgrade ${b}${w}, obaveštavamo vas da počinju radovi${r ? ": " + r : ""}. Radovi se izvode uz poštovanje propisanih mera bezbednosti i zdravlja na radu (BZR). Molimo za oprez i razumevanje. Upravnik.` },
    done:   { label: "Završetak radova", f: (b, w, r) => `Poštovani stanari zgrade ${b}${w}, obaveštavamo vas da su radovi završeni${r ? ": " + r : ""}. Hvala na strpljenju i saradnji. Upravnik.` },
    outage: { label: "Najava prekida (voda / struja / lift / grejanje)", f: (b, w, r) => `Poštovani stanari zgrade ${b}${w}, najavljujemo privremeni prekid${r ? ": " + r : ""}. Molimo da blagovremeno prilagodite svoje obaveze. Upravnik.` },
    fixed:  { label: "Kvar je otklonjen", f: (b, w, r) => `Poštovani stanari zgrade ${b}${w}, obaveštavamo vas da je kvar otklonjen${r ? ": " + r : ""}. Hvala na strpljenju. Upravnik.` },
    meeting:{ label: "Poziv na skupštinu / sastanak stanara", f: (b, w, r) => `Poštovani stanari zgrade ${b}, pozivamo vas na sastanak stanara${w}. ${r ? "Dnevni red: " + r + ". " : ""}Vaše prisustvo je važno, jer se o pitanjima zgrade odlučuje zajednički. Upravnik.` },
    payment:{ label: "Podsetnik za uplatu", f: (b, w, r) => `Poštovani stanari zgrade ${b}${w}, podsećamo vas na redovno izmirivanje obaveza prema stambenoj zajednici${r ? ": " + r : ""}. Molimo da pri uplati navedete tačan poziv na broj. Upravnik.` },
    cleaning:{ label: "Čišćenje / dezinfekcija / deratizacija", f: (b, w, r) => `Poštovani stanari zgrade ${b}${w}, obaveštavamo vas o planiranoj aktivnosti: ${r || "čišćenje / dezinfekcija / deratizacija"}. Molimo za razumevanje i da po potrebi omogućite pristup prostorijama. Upravnik.` },
    order:  { label: "Kućni red (buka, smeće, parking, ljubimci)", f: (b, w, r) => `Poštovani stanari zgrade ${b}${w}, molimo vas da poštujete kućni red i čistoću zajedničkih prostora${r ? ": " + r : ""}. Hvala na razumevanju. Upravnik.` },
    urgent: { label: "Hitno upozorenje", f: (b, w, r) => `HITNO — stanari zgrade ${b}${w}: ${r || "molimo da obratite pažnju na hitno obaveštenje upravnika"}. U slučaju neposredne opasnosti odmah pozovite 112. Upravnik.` }
  };

  
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEYS = { buildings: "upravnik_viber_buildings_v1", log: "upravnik_viber_log_v1", script: "upravnik_viber_script_v1" };
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } } };
const state = { script: LS.get(KEYS.script) || "lat", mode: "tenant", buildings: [], log: [] };
try { const b = JSON.parse(LS.get(KEYS.buildings) || "null"); state.buildings = Array.isArray(b) && b.length ? b : [...DEFAULT_BUILDINGS]; } catch(e){ state.buildings = [...DEFAULT_BUILDINGS]; }
try { const l = JSON.parse(LS.get(KEYS.log) || "null"); state.log = Array.isArray(l) ? l : []; } catch(e){ state.log = []; }

function saveLogStore(){
  if(!LS.set(KEYS.log, JSON.stringify(state.log))) LS.set(KEYS.log, JSON.stringify(state.log.map(x => ({...x, image: null}))));
  $("cnt").textContent = state.log.length ? "(" + state.log.length + ")" : "";
}
function toast(m){ const t=$("toast"); t.textContent=fmtScript(m); t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }
function curTpl(){ return TEMPLATES.find(t => t.id === $("topic").value) || TEMPLATES[0]; }
function noteSentence(n){ const c=(n||"").trim(); if(!c) return ""; const u=c.charAt(0).toUpperCase()+c.slice(1); return /[.!?]$/.test(u) ? u+" " : u+". "; }

function fillSelects(){
  const opts = state.buildings.map(b => `<option value="${esc(b)}">${esc(fmtScript(b))}</option>`).join("");
  const keep = [$("bld").value, $("nbld").value];
  $("bld").innerHTML = opts; $("nbld").innerHTML = opts;
  if (keep[0]) $("bld").value = keep[0]; if (keep[1]) $("nbld").value = keep[1];
  const cur = $("topic").value || "general";
  const groups = {}; TEMPLATES.forEach(t => (groups[t.group] = groups[t.group] || []).push(t));
  $("topic").innerHTML = Object.keys(groups).map(g => `<optgroup label="${esc(fmtScript(g))}">${groups[g].map(t => `<option value="${t.id}">${esc(fmtScript(t.name))}</option>`).join("")}</optgroup>`).join("");
  $("topic").value = cur;
  const nt = $("ntype").value || "info";
  $("ntype").innerHTML = Object.keys(NOTICES).map(k => `<option value="${k}">${esc(fmtScript(NOTICES[k].label))}</option>`).join("");
  $("ntype").value = nt;
  const fb=$("fb").value, ft=$("ft").value, fs=$("fs").value;
  $("fb").innerHTML = `<option value="__ALL__">${esc(fmtScript("Sve zgrade"))}</option>` + opts;
  $("ft").innerHTML = `<option value="__ALL__">${esc(fmtScript("Sve teme"))}</option>` + [...TEMPLATES.map(t=>t.name), "Obaveštenje"].map(n => `<option value="${esc(n)}">${esc(fmtScript(n))}</option>`).join("");
  $("fs").innerHTML = ["__ALL__:Svi statusi","wait:Čeka odgovor","done:Odgovoreno"].map(x => { const [v,l]=x.split(":"); return `<option value="${v}">${esc(fmtScript(l))}</option>`; }).join("");
  if (fb) $("fb").value = fb; if (ft) $("ft").value = ft; if (fs) $("fs").value = fs;
}
function labels(){
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = fmtScript(e.dataset.t));
  document.querySelectorAll("[data-p]").forEach(e => e.placeholder = fmtScript(e.dataset.p));
}
function toggleScript(){ state.script = state.script === "lat" ? "cyr" : "lat"; LS.set(KEYS.script, state.script); labels(); fillSelects(); gen(); genNotice(); renderLog(); }

function tab(t){
  ["a","n","l"].forEach(k => { $("sec_"+k).hidden = k !== t; $("tab_"+k).classList.toggle("on", k === t); });
  if (t === "l") renderLog();
  scrollTo(0,0);
}
function mode(m){ state.mode = m; $("m_t").classList.toggle("on", m==="tenant"); $("m_m").classList.toggle("on", m==="master"); if (m==="master") $("det").open = true; gen(); }

function detect(){
  const txt = normTxt($("q").value), words = txt.split(" ");
  let best = TEMPLATES[0], bs = 0;
  for (const tpl of TEMPLATES.slice(1)) { let n = scoreTemplate(tpl, txt, words); if (n && tpl.urgent) n += 5; if (n > bs) { bs = n; best = tpl; } }
  $("topic").value = best.id;
  gen();
}
function gen(){
  const tpl = curTpl();
  $("chip").textContent = fmtScript("Tema: " + tpl.name);
  $("master").placeholder = fmtScript(tpl.master ? "npr. " + tpl.master : "Majstor / servis (za poruku majstoru)");
  const bldg = $("bld").value || "zgrada", tenant = $("tenant").value.trim(), note = $("note").value.trim(), q = $("q").value.trim(), master = $("master").value.trim();
  let msg;
  if (state.mode === "master") {
    msg = [`PRIJAVA — ${tpl.name} — ${bldg}`, master ? `Prosleđuje se: ${master}` : "", tenant ? `Stanar / stan: ${tenant}` : "", q ? `Opis prijave: ${q}` : "", media.q.length ? `Prilozi stanara: ${media.q.map(m => m.name).join(", ")}` : "", note ? `Napomena upravnika: ${note}` : "", tpl.tech ? "Molim za informaciju kada možete izaći na teren. Upravnik." : "Molim za informaciju ili mišljenje. Upravnik."].filter(Boolean).join("\n");
  } else {
    msg = tpl.body.replace("{tenant}", tenant ? ` (${tenant})` : "").replace("{building}", bldg).replace("{note}", noteSentence(note));
    msg = msg.replace(/(\.\s)([a-zčćžšđ])/g, (m, a, b) => a + b.toUpperCase());
  }
  $("out").value = fmtScript(msg);
}
function genNotice(){
  const n = NOTICES[$("ntype").value] || NOTICES.info, w = $("nwhen").value.trim();
  $("nout").value = fmtScript(n.f($("nbld").value || "zgrada", w ? ` (${w})` : "", $("ntext").value.trim()));
}
async function pasteQ(){
  try { const t = await navigator.clipboard.readText(); if (!t.trim()) return toast("Nema ničega u kopiranom tekstu"); $("q").value = t.trim(); detect(); toast("Poruka nalepljena"); }
  catch(e){ $("q").focus(); toast("Nalepite poruku ručno u polje (dugi pritisak → Nalepi)"); }
}
function voice(target, status){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, st = $(status);
  if (!SR) { st.textContent = fmtScript("Glasovni unos nije podržan u ovom pregledaču. Ukucajte napomenu."); return; }
  const r = new SR(); r.lang = "sr-RS"; r.interimResults = false; r.maxAlternatives = 1;
  st.textContent = fmtScript("🎤 Slušam... govorite.");
  r.onresult = ev => { const t = ev.results[0][0].transcript, el = $(target); el.value = el.value ? el.value + " " + t : t; st.textContent = fmtScript("✓ " + t); if (target === "note") gen(); else genNotice(); };
  r.onerror = () => { st.textContent = fmtScript("Snimanje nije uspelo. Proverite dozvolu za mikrofon."); };
  r.start();
}
async function copyT(id){
  const v = $(id).value; if (!v.trim()) return;
  try { await navigator.clipboard.writeText(v); } catch(e){ $(id).select(); document.execCommand("copy"); }
  toast("Kopirano! Nalepite u Viber.");
}
async function shareT(id){
  const v = $(id).value; if (!v.trim()) return;
  if (navigator.share) { try { await navigator.share({ text: v }); return; } catch(e){ if (e.name === "AbortError") return; } }
  copyT(id);
}
const media = { q: [], r: [], n: [] };
function pick(slot){ $("f_" + slot).click(); }
function addMedia(slot, files){
  let added = 0;
  for (const f of files) {
    const kind = f.type && f.type.startsWith("image/") ? "image" : f.type && f.type.startsWith("video/") ? "video" : null;
    if (!kind) continue;
    media[slot].push({ id: Date.now() + "_" + Math.random().toString(36).slice(2,6), file: f, url: URL.createObjectURL(f), kind, name: f.name || (kind === "image" ? "slika.jpg" : "video.mp4") });
    added++;
  }
  renderMedia(slot); if (slot === "q") gen();
  if (added) toast(added > 1 ? "Prilozi su dodati" : "Prilog je dodat");
}
function removeMedia(slot, id){
  const i = media[slot].findIndex(m => m.id === id);
  if (i > -1) { URL.revokeObjectURL(media[slot][i].url); media[slot].splice(i, 1); }
  renderMedia(slot); if (slot === "q") gen();
}
function renderMedia(slot){
  $("m" + slot).innerHTML = media[slot].map(m => `<div class="th">${m.kind === "image" ? `<img src="${esc(m.url)}" alt="">` : `<video src="${esc(m.url)}#t=0.1" muted playsinline preload="metadata"></video><span class="pl">▶</span>`}<button class="x" data-slot="${slot}" data-id="${esc(m.id)}" aria-label="Ukloni">✕</button></div>`).join("");
}
function clearMedia(slot){ media[slot].forEach(m => URL.revokeObjectURL(m.url)); media[slot] = []; renderMedia(slot); }
async function shareFiles(textId, items, hintId){
  const text = $(textId).value, files = items.map(m => m.file), hint = $(hintId);
  hint.textContent = "";
  if (!files.length) return shareT(textId);
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ text, files }); hint.textContent = fmtScript("Ako je Viber primio samo prilog, nalepite i tekst (tipka Kopiraj)."); return; }
    catch(e){ if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); } catch(e){}
  files.forEach(f => { const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name || "prilog"; document.body.appendChild(a); a.click(); a.remove(); });
  hint.textContent = fmtScript("Ovaj uređaj ne dozvoljava slanje priloga odavde. Tekst je kopiran, a prilozi su sačuvani na uređaju: dodajte ih ručno u Viber.");
}
function shareOut(){ return shareFiles("out", state.mode === "master" ? [...media.q, ...media.r] : media.r, "sh1"); }
function shareN(){ return shareFiles("nout", media.n, "sh2"); }
function toThumb(file, max = 720, q = 0.62){
  return new Promise(res => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = () => { URL.revokeObjectURL(u); res(null); };
    img.src = u;
  });
}
async function mediaForLog(items){
  const im = items.find(m => m.kind === "image");
  return { image: im ? await toThumb(im.file) : null, videoName: items.filter(m => m.kind === "video").map(m => m.name).join(", ") };
}
function addLog(o){ state.log.unshift({ id: Date.now() + "_" + Math.random().toString(36).slice(2,6), time: new Date().toLocaleString("sr-RS"), tenant:"", master:"", image:null, videoName:"", answered:false, ...o }); saveLogStore(); }
async function saveLog(){
  const tpl = curTpl(), md = await mediaForLog([...media.q, ...media.r]);
  addLog({ building: $("bld").value, tenant: $("tenant").value.trim(), master: $("master").value.trim(), topic: tpl.name, question: $("q").value.trim() || "(Poruka bez teksta)", answer: $("out").value.trim(), ...md });
  toast("Sačuvano u evidenciju");
}
async function saveNotice(){
  const md = await mediaForLog(media.n);
  addLog({ building: $("nbld").value, topic: "Obaveštenje", question: $("ntext").value.trim() || "(Obaveštenje)", answer: $("nout").value.trim(), ...md });
  toast("Sačuvano u evidenciju");
}
function clearAll(){ clearMedia("q"); clearMedia("r"); $("sh1").textContent = ""; ["q","note","tenant","master"].forEach(i => $(i).value = ""); $("topic").value = "general"; state.mode = "tenant"; $("m_t").classList.add("on"); $("m_m").classList.remove("on"); gen(); scrollTo(0,0); }
function renderLog(){
  const fb=$("fb").value||"__ALL__", ft=$("ft").value||"__ALL__", fs=$("fs").value||"__ALL__";
  const items = state.log.filter(x => (fb==="__ALL__"||x.building===fb) && (ft==="__ALL__"||x.topic===ft) && (fs==="__ALL__"||(fs==="done")===Boolean(x.answered)));
  $("list").innerHTML = items.length ? items.map(x => `<div class="card">
    <div><b>${esc(fmtScript(x.building))}</b> ${x.topic?`<span class="badge">${esc(fmtScript(x.topic))}</span>`:""} <span class="badge ${x.answered?"ok":"warn"}">${esc(fmtScript(x.answered?"Odgovoreno":"Čeka odgovor"))}</span></div>
    <div class="hint">${esc(x.time)}${x.tenant?" • "+esc(x.tenant):""}${x.master?" • "+esc(fmtScript("Majstor: "+x.master)):""}</div>
    <div class="q">${esc(fmtScript(x.question))}</div>${x.image?`<img class="p" src="${esc(x.image)}" alt="">`:""}
    <div class="a">${esc(fmtScript(x.answer))}</div>
    <div class="row"><button class="big sm" data-act="copy" data-id="${esc(x.id)}">${esc(fmtScript("📋 Kopiraj"))}</button><button class="big sm ghost" data-act="done" data-id="${esc(x.id)}">${esc(fmtScript(x.answered?"↩ Nije":"✓ Odgovoreno"))}</button><button class="big sm ghost" data-act="del" data-id="${esc(x.id)}" style="color:var(--bad);border-color:var(--bad)">🗑</button></div>
  </div>`).join("") : `<p class="hint">${esc(fmtScript("Nema sačuvanih zapisa za izabrani filter."))}</p>`;
}
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const x = state.log.find(i => i.id === b.dataset.id); if (!x) return;
  if (b.dataset.act === "copy") { try { await navigator.clipboard.writeText(x.answer); toast("Kopirano!"); } catch(err){ toast("Kopiranje nije uspelo"); } }
  if (b.dataset.act === "done") { x.answered = !x.answered; saveLogStore(); renderLog(); }
  if (b.dataset.act === "del") { if (b.dataset.armed) { state.log = state.log.filter(i => i.id !== x.id); saveLogStore(); renderLog(); } else { b.dataset.armed = "1"; b.textContent = fmtScript("Pritisnite opet"); } }
});
$("q").addEventListener("input", detect);
["topic","bld","tenant","note","master"].forEach(i => $(i).addEventListener("input", gen));
["ntype","nbld","ntext","nwhen"].forEach(i => $(i).addEventListener("input", genNotice));
["fb","ft","fs"].forEach(i => $(i).addEventListener("change", renderLog));
["q","r","n"].forEach(k => $("f_" + k).addEventListener("change", e => { addMedia(k, [...e.target.files]); e.target.value = ""; }));
document.querySelectorAll(".thumbs").forEach(el => el.addEventListener("click", e => { const b = e.target.closest("button.x"); if (b) removeMedia(b.dataset.slot, b.dataset.id); }));
document.addEventListener("paste", e => { const it = [...((e.clipboardData && e.clipboardData.items) || [])].find(i => i.type && i.type.startsWith("image/")); if (it) { const f = it.getAsFile(); if (f) addMedia($("sec_n").hidden ? "q" : "n", [f]); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); const fl = [...((e.dataTransfer && e.dataTransfer.files) || [])]; if (fl.length) addMedia($("sec_n").hidden ? "q" : "n", fl); });
labels(); fillSelects(); gen(); genNotice(); saveLogStore();
if ("serviceWorker" in navigator && false) {}
</script></body></html>
